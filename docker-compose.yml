name: wp-updates-notifier

x-dev: &dev
  build: &dev-build
    context: .
    dockerfile: docker/Dockerfile
    target: dev
    args: &dev-args
      PHP_VERSION: ${PHP_VERSION:-8.3}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
  image: wp-updates-notifier:php${PHP_VERSION:-8.3}
  working_dir: /app
  volumes:
    - .:/app
    - composer-cache:/home/dev/.composer/cache

services:
  # PHP CLI: linting, static analysis, smoke test.
  php:
    <<: *dev

  # Commit message check: `make commits`.
  commitlint:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: commitlint
    image: wp-updates-notifier:commitlint
    working_dir: /app
    volumes:
      - .:/app:ro

  # Installs the built zip into a fresh WordPress (`make test-dist`).
  dist:
    <<: *dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      WP_VERSION: ${WP_VERSION:-7.1.3}
      WP_DB_HOST: db

  # Composer helper: `docker compose run --rm composer require ...`
  composer:
    <<: *dev
    entrypoint: ["composer"]

  # CLI with pcov for coverage reports.
  coverage:
    build:
      <<: *dev-build
      target: coverage
    image: wp-updates-notifier:php${PHP_VERSION:-8.3}-coverage
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/home/dev/.composer/cache

  db:
    image: mariadb:11@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress_test
    # Throwaway test data: keep it in memory.
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 20

  # The plugin's PHPUnit suite on a pinned wordpress-develop checkout, with the
  # plugin mounted read-only in the checkout's plugins directory.
  wp-tests:
    build:
      <<: *dev-build
      target: wp-tests
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        WP_VERSION: ${WP_VERSION:-7.1.3}
    image: wp-updates-notifier:php${PHP_VERSION:-8.3}-wp${WP_VERSION:-7.1.3}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/opt/wp-updates-notifier:ro
      - .:/opt/wordpress-develop/src/wp-content/plugins/wp-updates-notifier:ro
    environment:
      WP_DB_HOST: db
      WP_MULTISITE: ${WP_MULTISITE:-0}

  # ----- Local site for manual testing (`make up`), profile "site" -----

  site-db:
    profiles: [site]
    image: mariadb:11@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
    volumes:
      - site-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 20

  wordpress:
    profiles: [site]
    build: &site-build
      context: .
      dockerfile: docker/Dockerfile
      target: site
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    image: &site-image wp-updates-notifier:site-php${PHP_VERSION:-8.3}
    depends_on:
      site-db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      # The same port inside, so the site URL works from inside the container too (loopback, REST, WP-Cron).
      # Published on loopback only: the site has debug output on and a fixed admin login, so it must not be
      # reachable from the local network.
      - "127.0.0.1:8080:8080"
    environment:
      WORDPRESS_DB_HOST: site-db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
      # WP_DEBUG and the other debug constants are set in wp-config.php by `make site-setup` (docker/site-setup.sh),
      # so WP-CLI sees them too.
    volumes:
      - site-wp:/var/www/html
      - .:/var/www/html/wp-content/plugins/wp-updates-notifier
      - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./examples/wpun-example-channel:/var/www/html/wp-content/plugins/wpun-example-channel:ro
      - ./docker/dev-plugins/wpun-dummy:/var/www/html/wp-content/plugins/wpun-dummy:ro
      - ./docker/dev-plugins/wpun-field-showcase:/var/www/html/wp-content/plugins/wpun-field-showcase:ro
      - ./docker/apache/ports.conf:/etc/apache2/ports.conf:ro
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./docker/site/php.ini:/usr/local/etc/php/conf.d/zz-site.ini:ro

  # WP-CLI against the local site: `make wp ARGS="plugin list"`. The same image as the site, so it reaches the same
  # object cache.
  wp-cli:
    profiles: [site]
    build: *site-build
    image: *site-image
    user: "33:33"
    working_dir: /var/www/html
    depends_on:
      - wordpress
    volumes:
      - site-wp:/var/www/html
      - .:/var/www/html/wp-content/plugins/wp-updates-notifier
      - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./examples/wpun-example-channel:/var/www/html/wp-content/plugins/wpun-example-channel:ro
      - ./docker/dev-plugins/wpun-dummy:/var/www/html/wp-content/plugins/wpun-dummy:ro
      - ./docker/dev-plugins/wpun-field-showcase:/var/www/html/wp-content/plugins/wpun-field-showcase:ro
      - ./docker/site-setup.sh:/usr/local/bin/wpun-site-setup:ro
    environment:
      WORDPRESS_DB_HOST: site-db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
      # SITE_HOST=127.0.0.1 in .env (then `make site-setup`) avoids the slow IPv6 `localhost` from a Windows browser on WSL2.
      SITE_URL: http://${SITE_HOST:-localhost}:8080
      # `on` or `off`: whether `make site-setup` turns the persistent object cache on (set it in .env to keep it off).
      OBJECT_CACHE: ${OBJECT_CACHE:-on}
    entrypoint: ["wp"]

  # Persistent object cache for the local site (Redis Object Cache talks to it). `make wp ARGS="redis status"`.
  valkey:
    profiles: [site]
    image: valkey/valkey:9.1-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    # Kept on disk: with the cache on, transients live only here, among them the update data WordPress fetches from
    # wordpress.org. Losing it on every restart would make the next admin page wait for those requests again.
    command: ["valkey-server", "--save", "60", "1"]
    volumes:
      - site-cache:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Catches all outgoing mail: http://localhost:8025
  mailpit:
    profiles: [site]
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      # Loopback only: Mailpit shows every captured email, password-reset links included.
      - "127.0.0.1:8025:8025"

  # Echoes every request it receives (a stand-in for a Slack or other webhook):
  # http://webhook:8080 inside the network, `docker compose logs webhook` to read.
  webhook:
    profiles: [site]
    image: mendhak/http-https-echo:42@sha256:a265f55c86cb3baead76fdf379dc8e9e6440ed121874e101e60b833e05bce8d4
    environment:
      HTTP_PORT: "8080"

  # ----- Documentation site (`make docs`), profile "docs": not started by `make up` -----

  # MkDocs Material and mike: `make docs`, `make docs-serve`, `make docs-deploy`. Writes build/docs. The Markdown
  # files are not in the image (.dockerignore leaves them out), the repository is bind-mounted. Runs as the host user.
  docs:
    profiles: [docs]
    build: docker/docs
    image: wp-updates-notifier:docs
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      HOME: /tmp
      # Material's banner about MkDocs 2.0 on every build.
      NO_MKDOCS_2_WARNING: "true"
      # MkDocs imports docker/docs/hooks.py from the bind mount: no __pycache__ in the repository.
      PYTHONDONTWRITEBYTECODE: "1"
      # The repository is owned by the host user and mike runs git in it.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      # Who mike's commits to the local gh-pages branch are by. No credentials reach the container: the caller pushes.
      GIT_AUTHOR_NAME: ${DOCS_GIT_NAME:-github-actions[bot]}
      GIT_AUTHOR_EMAIL: ${DOCS_GIT_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}
      GIT_COMMITTER_NAME: ${DOCS_GIT_NAME:-github-actions[bot]}
      GIT_COMMITTER_EMAIL: ${DOCS_GIT_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}

  # Live preview, http://localhost:8000: `make docs-serve`.
  docs-serve:
    extends: docs
    ports:
      # Loopback only, like the other published ports.
      - "127.0.0.1:8000:8000"
    command: ["mkdocs", "serve", "-a", "0.0.0.0:8000"]

  # ----- Security checks (`make security`), profile "security": not started by `make up` -----

  # Lints .github/workflows/ (and runs shellcheck on the run: blocks): `make check-workflows`.
  actionlint:
    profiles: [security]
    image: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    working_dir: /app
    volumes:
      - .:/app:ro

  # Audits .github/workflows/ for insecure patterns: `make check-workflows`. A GITHUB_PUBLIC_TOKEN in the environment
  # (a token that can only read public repositories) enables the audits that ask the GitHub API, for example impostor
  # commits; without one they are skipped. `make zizmor` hands it to the container as GH_TOKEN, and only when it is
  # set (zizmor refuses an empty token), so the gh CLI's own login on the host is left alone.
  zizmor:
    profiles: [security]
    image: ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
    working_dir: /app
    volumes:
      - .:/app:ro

  # Scans for committed secrets: `make secrets`. Needs .git for the history scan. Reports go to security-reports/.
  gitleaks:
    profiles: [security]
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app:ro
      - ./security-reports:/reports
    environment:
      # The repo is owned by the host user, git refuses it otherwise.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"

  # Known vulnerabilities in the lockfiles: `make audit` (composer.lock; docker/Dockerfile's global npm install has no lockfile).
  osv-scanner:
    profiles: [security]
    image: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app:ro
      - ./security-reports:/reports

  # SBOM of the built zip (CycloneDX): `make sbom`. Writes to build/.
  syft:
    profiles: [security]
    image: anchore/syft:v1.54.1@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /build
    volumes:
      - ./build:/build
    # The image has no writable /tmp, Syft wants a cache directory.
    tmpfs:
      - /tmp:mode=1777
    environment:
      SYFT_CHECK_FOR_APP_UPDATE: "false"
      XDG_CACHE_HOME: /tmp

  # Static analysis with the plugin's own rules in .semgrep/: `make sast`. No network needed.
  semgrep:
    profiles: [security]
    image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /src
    volumes:
      - .:/src:ro
      - ./security-reports:/reports
    environment:
      HOME: /tmp
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"

  # Taint analysis with Psalm and the WordPress sources, escapes and sinks in docker/psalm/wordpress-taint.phpstub:
  # `make taint`. Its own image, as Psalm 6 needs PHP 8.1+ and the plugin supports 7.4. No network needed.
  psalm:
    profiles: [security]
    build: docker/psalm
    image: wp-updates-notifier:psalm
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app:ro
      - ./security-reports:/reports
    environment:
      HOME: /tmp

  # Dockerfile misconfigurations and known vulnerabilities in the built image: `make audit-images`. Reports only.
  # Root, as the cache volume and (for the image scan, added by the make target) the Docker socket need it.
  trivy:
    profiles: [security]
    image: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    working_dir: /app
    volumes:
      - .:/app:ro
      - trivy-cache:/root/.cache/trivy

volumes:
  composer-cache:
  trivy-cache:
  site-db:
  site-wp:
  site-cache:
