# lychee settings for `make docs-links`: the links of the built site (build/docs) and of the files that are not part of
# it (README.md, the generated build/readme.txt, CONTRIBUTING.md). Links to other sites are the point. Internal links and anchors in the
# site are already checked by the strict `make docs` build; lychee checks the files it is given again, which is fine.

# A server that is busy or limits requests gets a few more tries, so a hiccup does not fail a pull request.
max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 8

# 429 is a rate limit, not a broken link. Everything else that is not 2xx fails.
accept = ["200..=299", "429"]

# A link to this repository's main branch is checked against the checkout, so a pull request that adds a file and
# links to it passes before the file is on main, and one that removes a linked file fails.
remap = ['^https://github\.com/l3rady/wp-updates-notifier/(?:blob|tree)/main/([^#?]*).*$ file:///app/$1']

# A root-relative link in the built HTML (/assets/...) is looked up in the built folder.
root_dir = "/app/build/docs"

exclude = [
  # Examples in the docs and code samples: nothing listens there.
  '^https?://localhost(:\d+)?(/|$)',
  '^https?://127\.0\.0\.1(:\d+)?(/|$)',
  # Reserved for examples (RFC 2606): the domain never serves a page.
  '^https?://([a-z0-9-]+\.)*example\.(com|org)(/|$)',
  # The `latest` alias of the docs site only exists once the 2.0.0 release has been deployed, so it is a 404 until then.
  # Remove this line after 2.0.0 is released.
  '^https://wpun\.cariss\.dev/latest(/|$)',
  # In a plain `make docs` build, every page's <link rel="canonical"> is its unversioned address (site_url + path).
  # Only `mike deploy` points it at /latest/ (canonical_version in mkdocs.yml), and lychee cannot skip one HTML
  # element. Links in the sources go to the root or to a versioned path, which are still checked.
  '^https://wpun\.cariss\.dev/(users|developers|decisions|security)(/|$)',
  # LinkedIn answers every automated request with 999, whatever the page.
  '^https://www\.linkedin\.com/',
  # gnu.org times out from GitHub's runners, though the licence page is fine (#295).
  '^https://www\.gnu\.org/',
]
