# Local site only: the default site on port 8080, see ports.conf.
<VirtualHost *:8080>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# Keep browser connections open between page views. Apache's default of 5 s means any pause opens new
	# connections, and from a Windows browser on WSL2 each new connection to `localhost` first waits for IPv6 (::1),
	# which never answers, before falling back to IPv4.
	KeepAliveTimeout 300
	MaxKeepAliveRequests 0

	# A missing static file (favicon.ico, DevTools' *.map files, …) gets a plain 404 instead of a redirect and a
	# full WordPress page.
	RewriteEngine On
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
	RewriteRule \.(ico|map|css|js|png|jpe?g|gif|svg|webp|woff2?|ttf)$ - [R=404,L]
</VirtualHost>
