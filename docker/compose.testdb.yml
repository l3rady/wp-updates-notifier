# The test database, in a project of its own (decision 0032). Every PHPUnit run, in every checkout, uses this one
# container; the Makefile starts it before each target that needs it (`make testdb`). `make down` and `make clean`
# act on the root project only, so they do not stop it under a run in another checkout. The root docker-compose.yml
# joins the network named below as an external network, and the service name `db` is the host name.
#
# Stop it by hand with `docker compose -f docker/compose.testdb.yml down`.
name: wpun-testdb

services:
  db:
    image: mariadb:12@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress_test
    # Throwaway test data: keep it in memory.
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 60s

networks:
  default:
    name: wpun-testdb
