# The multisite of `make e2e-ms` (compose.multisite.yml): docker/apache/000-default-ms.conf on port 8080, where the flows
# site listens. Keep the rewrite rules the same.
<VirtualHost *:8080>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# A missing static file gets a plain 404 instead of a redirect and a full WordPress page. Not under a sub-site's
	# path (/alpha/wp-content/…): .htaccess maps those to the real files.
	RewriteEngine On
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
	RewriteCond %{REQUEST_URI} !^/[_0-9a-zA-Z-]+/wp-(content|admin|includes)/
	RewriteRule \.(ico|map|css|js|png|jpe?g|gif|svg|webp|woff2?|ttf)$ - [R=404,L]
</VirtualHost>
