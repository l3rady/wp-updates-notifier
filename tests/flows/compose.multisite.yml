# Added to compose.yml by `make e2e-ms` (run.sh, FLOWS_MULTISITE=1): the same throwaway site as a subdirectory
# multisite with the plugin network-activated. Its own compose project (wpun-flows-ms), so it can run beside `make e2e`.
services:
  wordpress:
    volumes:
      - ./apache-ms.conf:/etc/apache2/sites-available/000-default.conf:ro

  wp-cli:
    environment:
      SITE_KIND: network

  playwright:
    environment:
      FLOWS_MULTISITE: "1"
