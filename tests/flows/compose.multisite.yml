# Added to compose.yml by `make e2e-ms` (run.sh, FLOWS_MULTISITE=1): the same throwaway site as a subdirectory
# multisite with the plugin network-activated.
# Its own compose project (wpun-flows-ms plus the checkout token). It shares the tests/e2e lock with `make e2e`, so the
# two do not run at the same time in one checkout.
services:
  wordpress:
    volumes:
      - ./apache-ms.conf:/etc/apache2/sites-available/000-default.conf:ro

  wp-cli:
    environment:
      SITE_KIND: network

  playwright:
    environment:
      FLOWS_MULTISITE: "1"
