# The documentation site (https://wpun.cariss.dev): MkDocs Material, built from docs/, versioned with mike.
# `make docs` builds it into build/docs, `make docs-serve` previews it. Runs in Docker (docker/docs).
site_name: WP Updates Notifier
site_description: Documentation for WP Updates Notifier, the WordPress plugin that tells you when updates are waiting.
site_url: https://wpun.cariss.dev/
# No repo_url: Material would then ask api.github.com for the star and release counts on every page view, a request
# to a third party. The repository is linked from the footer instead (extra.social below).

docs_dir: docs
site_dir: build/docs

# A warning fails the build, and the validation below makes broken links and anchors warnings.
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# The generated hook reference stays under docs/developers/ (bin/hook-docs.php writes it), README.md is the section index.
nav:
  - Home: index.md
  - Users:
      - users/README.md
      - Getting started: users/getting-started.md
      - Settings: users/settings.md
      - Channels: users/channels.md
      - Multisite networks: users/multisite.md
      - Muting a plugin or theme: users/muting.md
      - How notifications work: users/how-notifications-work.md
      - Settings in code: users/settings-in-code.md
      - WP-CLI: users/wp-cli.md
      - Troubleshooting: users/troubleshooting.md
  - Developers:
      - developers/README.md
      - Architecture: developers/architecture.md
      - Tests and checks: developers/testing.md
      - Translations: developers/translations.md
      - Writing a module: developers/writing-a-module.md
      - Item types and routing: developers/item-types-and-routing.md
      - Muting from code: developers/muting-from-code.md
      - Configuration sources: developers/configuration-sources.md
      - Hook reference: developers/hooks.md
      - Stability and deprecation: developers/stability.md
  - Decisions:
      - decisions/README.md
      - 0001 Licence: decisions/0001-licence-gpl-2-or-later.md
      - 0002 PHP and WordPress minimums: decisions/0002-php-7-4-and-wordpress-6-7-minimums.md
      - 0003 Main file rename: decisions/0003-rename-main-file-without-a-migration-stub.md
      - 0004 Module API and dogfooding: decisions/0004-public-module-api-and-dogfooding.md
      - 0005 Separate options: decisions/0005-settings-state-and-channels-in-separate-options.md
      - 0006 Slack dropped: decisions/0006-drop-slack-in-2-0-0-and-keep-its-settings.md
      - 0007 Configuration sources: decisions/0007-settings-and-secrets-from-outside-the-database.md
      - 0008 Single sites only: decisions/0008-single-sites-only-in-2-0-0.md
      - 0009 No update check lock: decisions/0009-no-lock-against-overlapping-update-checks.md
      - 0010 WordPress update emails: decisions/0010-leave-wordpress-auto-update-emails-alone.md
      - 0011 Accessibility: decisions/0011-accessibility-wcag-2-2-aa-without-javascript.md
      - 0012 Security tooling: decisions/0012-security-tooling-is-free-deterministic-and-scripted.md
      - 0013 Verifiable releases: decisions/0013-verifiable-release-artefacts.md
      - 0014 Documentation site: decisions/0014-documentation-site-on-a-custom-subdomain.md
      - 0015 Commits and history: decisions/0015-conventional-commits-and-linear-history.md
      - 0016 Pending update reminders: decisions/0016-pending-update-reminders-per-channel.md
      - 0017 Bundled translations: decisions/0017-bundle-l10n-php-translations-only.md
      - 0018 Generated readme: decisions/0018-generate-readme-at-build-time.md
      - 0019 Mutes: decisions/0019-mutes-in-their-own-option-through-the-global-veto.md
      - 0020 Automatic updates first: decisions/0020-scheduled-checks-run-wordpress-automatic-updates-first.md
      - 0021 Network-only on multisite: decisions/0021-network-only-on-multisite.md
      - 0022 Remind on every check: decisions/0022-remind-on-every-check.md
      - 0023 Snooze: decisions/0023-snooze-time-checked-on-read-pruned-on-next-write.md
      - 0024 Resolved items: decisions/0024-resolved-items-detected-by-the-update-check.md
  - Security:
      - Threat model: security/threat-model.md
      - AI review for 2.0.0: security/ai-review-2.0.0.md
      - Security audit for 2.0.0: security/audit-2.0.0.md

theme:
  name: material
  language: en
  # System fonts: nothing is loaded from Google.
  font: false
  # The tab icon follows the system scheme (it is one SVG with a media query). The header logo is two images, one per
  # scheme, from the logo partial in docker/docs/overrides: it follows the visitor's palette toggle.
  favicon: assets/brand/favicon.svg
  custom_dir: docker/docs/overrides
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
  # Three states, in this order: automatic (the first visit; follows the system), dark, light. The Solarized schemes are
  # in docs/stylesheets/extra.css.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: solarized-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: solarized-light
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to system preference

extra_css:
  - stylesheets/extra.css

# Mermaid is self-hosted (docker/docs/hooks.py adds the file): Material would fetch it from unpkg.com otherwise.
extra_javascript:
  - assets/javascripts/mermaid.min.js

hooks:
  - docker/docs/hooks.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/l3rady/wp-updates-notifier
      name: WP Updates Notifier on GitHub
  version:
    provider: mike
    alias: true

plugins:
  - search
  # Every version's canonical link points at the same page under the `latest` alias, which search engines should
  # index, instead of an unversioned address the versioned site does not have. Material draws the version selector.
  - mike:
      canonical_version: latest
      version_selector: false

markdown_extensions:
  - admonition
  - attr_list
  # Cards and the icons on the home page. The icons are inline SVG from the theme, nothing is fetched.
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
