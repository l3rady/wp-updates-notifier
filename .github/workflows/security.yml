name: security

# Security checks, one job per tool, each run through its make target in the same
# Docker setup used locally (see the Makefile). Findings fail the job and, where the
# tool writes SARIF, also go to code scanning. Weekly, because new rules and new
# advisories appear without any change to this repository.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The workflows themselves: actionlint (with shellcheck on the run: blocks) and zizmor.
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      # Lets zizmor run the audits that ask the GitHub API; without a token it skips them.
      # docker-compose.yml hands it to zizmor as GH_TOKEN.
      GITHUB_PUBLIC_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the workflows (actionlint, zizmor)
        run: make check-workflows
      # zizmor again as SARIF, so its findings also show up in code scanning. Its own
      # target, so it runs even when actionlint failed above; that failure is already
      # reported by the step above.
      - name: Write zizmor's findings as SARIF
        if: always()
        run: make zizmor ZIZMOR_FORMAT=sarif ZIZMOR_OUT=zizmor.sarif || true
      # Fork pull requests cannot upload SARIF.
      - name: Upload the findings to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  # gitleaks over the git history, the working tree and the built zip. A pull request scans
  # only its own commits; pushes to main, the weekly run and manual runs scan the whole history.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history scan needs every commit.
          fetch-depth: 0
          persist-credentials: false
      # make -k so the tree and the zip are scanned (and their reports written) even when the history scan fails.
      - name: Scan for secrets (gitleaks)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            make -k secrets SECRETS_SARIF=1 SECRETS_LOG_OPTS="$BASE_SHA..$HEAD_SHA"
          else
            make -k secrets SECRETS_SARIF=1
          fi
      # Fork pull requests cannot upload SARIF. One upload per report, each with its own category.
      - name: Upload the history findings to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('security-reports/history.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: security-reports/history.sarif
          category: gitleaks-history
      - name: Upload the working tree findings to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('security-reports/tree.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: security-reports/tree.sarif
          category: gitleaks-tree
      - name: Upload the zip findings to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('security-reports/zip.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: security-reports/zip.sarif
          category: gitleaks-zip

  # Known vulnerabilities and abandoned packages in the locked dependencies: composer audit and OSV-Scanner.
  dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make -k so OSV-Scanner still runs (and writes its report) when composer audit fails.
      - name: Audit the dependencies (composer audit, OSV-Scanner)
        run: make -k audit AUDIT_SARIF=1
      # Fork pull requests cannot upload SARIF.
      - name: Upload the findings to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('security-reports/osv.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: security-reports/osv.sarif
          category: osv-scanner

  # What a pull request adds to the dependency graph: no new known vulnerabilities, and only licences that
  # fit a GPL-2.0-or-later plugin. The dependencies are development tools and are not shipped in the zip.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # GPL-compatible licences. Apache-2.0 is not compatible with GPL-2.0-only, but the plugin is
          # GPL-2.0-or-later (compatible with GPLv3) and these are development tools that are not shipped.
          allow-licenses: >-
            MIT, BSD-2-Clause, BSD-3-Clause, ISC, Apache-2.0, GPL-2.0-or-later, GPL-2.0-only,
            GPL-3.0-or-later, GPL-3.0-only, LGPL-2.1-or-later, LGPL-3.0-or-later, MPL-2.0,
            Unlicense, CC0-1.0, 0BSD, Zlib
          # Development tools that run in their own images and are never shipped or linked into the plugin:
          # jsonmapper (OSL-3.0) comes with Psalm in docker/psalm, and argparse (Python-2.0, GPL-compatible) with
          # commitlint in docker/commitlint. In docker/docs (the documentation site): watchdog (Apache-2.0 AND
          # Python-2.0, both GPL-compatible) with MkDocs, and robust-predicates (public domain AND Unlicense) with
          # Mermaid.
          allow-dependencies-licenses: >-
            pkg:composer/netresearch/jsonmapper, pkg:npm/argparse, pkg:pypi/watchdog, pkg:npm/robust-predicates

  # Trivy over docker/ and the image CI builds. It only reports (exit code 0): the base image's findings are
  # fixed by a new base image, not by this repository. Not on pull requests, it needs no gate there.
  images:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the Dockerfile and the image (Trivy)
        run: make audit-images

  # Semgrep with the plugin's own rules in .semgrep/ (CodeQL does not read PHP), plus the check that every
  # suppression carries a reason and every PHP file has its guard.
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make -k so the rule tests and the suppression check still run when the scan finds something.
      - name: Static analysis (Semgrep)
        run: make -k sast SAST_SARIF=1
      # Fork pull requests cannot upload SARIF.
      - name: Upload the findings to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('security-reports/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: security-reports/semgrep.sarif
          category: semgrep

  # Psalm taint analysis: data from WordPress sources (plugin headers, options, transients) that reaches an unsafe
  # sink (output, mail body, outbound URL, SQL) without an escape. Taint findings only; PHPStan does the type checks.
  # Runs from docker/psalm, as Psalm 6 needs PHP 8.1+. psalm-baseline.xml may only shrink.
  taint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Taint analysis (Psalm)
        run: make taint TAINT_SARIF=1
      # Fork pull requests cannot upload SARIF.
      - name: Upload the findings to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('security-reports/psalm.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: security-reports/psalm.sarif
          category: psalm
