name: ci

# The test layers described in the README, run in the same Docker setup used
# locally (see the Makefile). Lint lives in lint.yml, commit checks in commits.yml.
on:
  pull_request:
  push:
    branches:
      - main
  # Nightly against WordPress trunk, to notice core changes before a release.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      wp_version:
        description: 'WordPress version, tag or branch to test against (for example trunk)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs can this change affect? bin/ci-changes.sh maps the changed files to jobs (the table in that script is
  # the map). On a pull request the jobs the diff cannot affect skip; every other event, the Release PR, a shared file
  # and any file the map does not know run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      jobs: ${{ steps.map.outputs.jobs }}
      full: ${{ steps.map.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request's merge commit and its first parent, the base branch, which the diff is taken against.
          fetch-depth: 2
      - name: Map the changed files to jobs
        id: map
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_HEAD_REF: ${{ github.head_ref }}
        run: sh bin/ci-changes.sh HEAD^1 HEAD

  # Static analysis with the WordPress stubs, parsing as PHP 7.4.
  phpstan:
    needs: changes
    if: github.event_name != 'schedule' && contains(fromJSON(needs.changes.outputs.jobs), 'phpstan')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-cache
        with:
          vendor: 'true'
      - name: Static analysis (PHPStan)
        run: make stan

  # Rector must have nothing left to upgrade to PHP 7.4.
  rector:
    needs: changes
    if: github.event_name != 'schedule' && contains(fromJSON(needs.changes.outputs.jobs), 'rector')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-cache
        with:
          vendor: 'true'
      - name: PHP 7.4 syntax (Rector dry run)
        run: make rector

  # The scripts the release workflow runs on the Release PR, rehearsed on a copy.
  release-scripts:
    needs: changes
    if: github.event_name != 'schedule' && contains(fromJSON(needs.changes.outputs.jobs), 'release-scripts')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rehearse the release scripts
        run: make test-release
      - name: Check the map of changed files to jobs against the workflows
        run: make test-ci-changes

  # The plugin zip as users get it: runtime files only, and it installs,
  # activates, deactivates and uninstalls cleanly in a fresh WordPress.
  dist:
    needs: changes
    if: github.event_name != 'schedule' && contains(fromJSON(needs.changes.outputs.jobs), 'dist')
    name: dist (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.5']
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the zip
        run: make dist
      - name: Check its contents
        run: make dist-check
      - name: Install it into WordPress
        run: make test-dist

  # Two builds of the same commit, with a different umask, file times and time
  # zone, give a byte-identical zip.
  dist-repro:
    needs: changes
    if: github.event_name != 'schedule' && contains(fromJSON(needs.changes.outputs.jobs), 'dist-repro')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the zip twice and compare
        run: make dist-repro

  # WordPress.org's Plugin Check on the zip, and the header and generated
  # readme.txt rules it enforces, so a release is never refused at submission.
  # The generated Playground blueprint (Live Preview) and the WordPress.org assets are checked here too.
  plugin-check:
    needs: changes
    if: github.event_name != 'schedule' && contains(fromJSON(needs.changes.outputs.jobs), 'plugin-check')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the readme generator
        run: make test-readme
      - name: Plugin header and readme.txt
        run: make check-headers
      - name: Test the blueprint generator and its schema check
        run: make test-blueprint
      - name: Playground blueprint
        run: make check-blueprint
      - name: Test the WordPress.org assets check
        run: make test-wporg-assets
      - name: WordPress.org assets
        run: make wporg-assets-check
      - name: Build the zip
        run: make dist
      - name: Plugin Check
        run: make plugin-check

  # Every PHP file must lint on every supported PHP version.
  smoke:
    needs: changes
    if: github.event_name != 'schedule' && contains(fromJSON(needs.changes.outputs.jobs), 'smoke')
    name: smoke (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-cache
      - name: Check PHP and lint every file
        run: make smoke

  # The plugin's tests on WordPress's own test library with a real database,
  # on single site and multisite. WordPress 7.1.3 is the latest release; 6.7.9
  # is the minimum the plugin supports (see #50), so it runs on the oldest PHP
  # and on the newest PHP that WordPress 6.7 supports. That is 18 legs, run on
  # a push to main, a manual run and the Release PR. Any other pull request,
  # even one that changes a shared file, runs 4: single site only, on the oldest and the newest PHP with
  # WordPress 7.1.3, and on PHP 7.4 and 8.3 with WordPress 6.7.9. Every axis is
  # listed in each include entry, as an entry that only added a key would merge
  # into an existing combination.
  wordpress:
    needs: changes
    if: github.event_name != 'schedule' && contains(fromJSON(needs.changes.outputs.jobs), 'wordpress')
    name: wordpress ${{ matrix.wp }} ${{ matrix.multisite == '1' && 'multisite' || 'single' }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["7.4","8.0","8.1","8.2","8.3","8.4","8.5"]' || '["7.4","8.5"]') }}
        wp: ['7.1.3']
        multisite: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["0","1"]' || '["0"]') }}
        include: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[{"php":"7.4","wp":"6.7.9","multisite":"0"},{"php":"7.4","wp":"6.7.9","multisite":"1"},{"php":"8.3","wp":"6.7.9","multisite":"0"},{"php":"8.3","wp":"6.7.9","multisite":"1"}]' || '[{"php":"7.4","wp":"6.7.9","multisite":"0"},{"php":"8.3","wp":"6.7.9","multisite":"0"}]') }}
    env:
      PHP_VERSION: ${{ matrix.php }}
      WP_VERSION: ${{ inputs.wp_version || matrix.wp }}
      WP_MULTISITE: ${{ matrix.multisite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not for a manual run on another WordPress version: a branch such as trunk moves, and its cached clone would not.
      - uses: ./.github/actions/docker-cache
        if: inputs.wp_version == ''
      - name: Run the tests
        run: make ${{ matrix.multisite == '1' && 'test-wp-ms' || 'test-wp' }}

  # axe (WCAG 2.2 A and AA) and keyboard checks of the settings screen in a browser, on a throwaway site (tests/e2e).
  # Any violation fails the job; the Playwright report is kept when it does.
  a11y:
    needs: changes
    if: github.event_name != 'schedule' && contains(fromJSON(needs.changes.outputs.jobs), 'a11y')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Accessibility checks (axe and keyboard)
        run: make a11y
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: tests/e2e/reports/
          retention-days: 14

  # The flows of tests/flows in a real browser: settings, channels, a real update check from WP-CLI with fake pending
  # updates, and the mail it sends (caught by Mailpit), on a throwaway site. One PHP and WordPress combination.
  e2e:
    needs: changes
    if: github.event_name != 'schedule' && contains(fromJSON(needs.changes.outputs.jobs), 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: End-to-end flows
        run: make e2e

  # The same against WordPress trunk every night.
  wordpress-trunk:
    if: github.event_name == 'schedule'
    name: wordpress trunk ${{ matrix.multisite == '1' && 'multisite' || 'single' }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.5']
        multisite: ['0', '1']
    env:
      PHP_VERSION: ${{ matrix.php }}
      WP_VERSION: trunk
      WP_MULTISITE: ${{ matrix.multisite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the tests against trunk
        run: make ${{ matrix.multisite == '1' && 'test-wp-ms' || 'test-wp' }}

  # The only check this workflow requires: it fails unless every job above passed or was skipped. A job the changes
  # job skipped counts as passed, which a required check on the job itself would not. Add every new job to `needs`
  # (tests/bin/test-ci-changes.sh checks it).
  ci-gate:
    if: always()
    needs: [changes, phpstan, rector, release-scripts, dist, dist-repro, plugin-check, smoke, wordpress, a11y, e2e, wordpress-trunk]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the results of the jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed" ]; then
            echo "These jobs did not pass:" >&2
            echo "$failed" >&2
            exit 1
          fi
          echo "Every job passed or was skipped."
