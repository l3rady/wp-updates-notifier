name: release-please

# Merging to main never changes the version, and nothing merged to main reaches
# WordPress.org. release-please keeps a Release PR open; merging that PR makes a
# draft GitHub release, the release job below tags, attests and publishes it once
# the maintainer approves, and publishing it starts the deploy to SVN
# (wordpress-org.yml).
on:
  push:
    branches:
      - main
  # Refresh the Release PR by hand, without a push to main, or rehearse the
  # release job: it builds, signs a throwaway tag locally and stops before
  # anything is attested, pushed or published.
  workflow_dispatch:
    inputs:
      rehearse:
        description: Rehearse the release job (nothing is pushed or published)
        type: boolean
        default: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the release app's private key (the release job's `release` environment holds it too). An environment
    # limited to main, with no required reviewers, so this job runs unattended; `release` needs approval, so it
    # can't be reused here.
    environment: release-please
    # The release app's token does the writing; GITHUB_TOKEN only reads.
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A short-lived token from the release GitHub App, not GITHUB_TOKEN: pull requests it opens trigger CI (so the
      # required checks run on the Release PR), and commits it makes through the API are signed by GitHub.
      - name: Get a token from the release app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Only what release-please and the commit below need, not everything the app is installed with.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please only rewrites version strings in the files it is told
      # about, so the copyright year is set here, on the Release PR's own
      # branch. The stable tag needs no step: readme.txt is generated from the
      # plugin header when the zip is built.
      - name: Check out the Release PR
        if: ${{ steps.release.outputs.pr != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          persist-credentials: false

      # Committed through GitHub's API with the app token, so the commit is signed (main requires signed commits; a
      # git push from the runner would not be). bin/commit-payload.php builds the request; make test-release
      # rehearses it.
      - name: Set the copyright year
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          # The raw JSON, parsed below: a step's env is evaluated even when the step is skipped, and fromJSON('')
          # fails the whole job when there is no Release PR.
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(printf '%s' "$RELEASE_PR" | jq -r .headBranchName)"
          version="$(sed -n 's/.*"\.": "\(.*\)".*/\1/p' .release-please-manifest.json)"
          sh bin/update-copyright-year.sh "$(date +%Y)"
          files="$(git diff --name-only)"
          if [ -n "$files" ]; then
            # shellcheck disable=SC2086 # One argument per changed file; the paths have no spaces.
            php bin/commit-payload.php "$REPO" "$branch" "$(git rev-parse HEAD)" \
              "chore: set the copyright year for $version" $files \
              | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.url'
          fi

  # release-please makes a draft release and no tag (draft: true in
  # release-please-config.json). This job builds the zip from the release
  # commit, attests it, creates the signed tag, uploads the assets and only then
  # publishes the release. The v* tag ruleset forbids moving or deleting a
  # release tag, so everything that can fail runs before the tag is pushed, and
  # every step after it is safe to re-run.
  release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || inputs.rehearse }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the signing key, limited to main, and waits for the maintainer's approval.
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore signing for the attestations.
      attestations: write
    env:
      # A real release always wins over a rehearsal asked for in the same run.
      REHEARSE: ${{ inputs.rehearse && needs.release-please.outputs.release_created != 'true' && 'true' || 'false' }}
      # In a rehearsal: the head of main and a tag name that is never pushed.
      SHA: ${{ needs.release-please.outputs.sha || github.sha }}
      TAG: ${{ needs.release-please.outputs.tag_name || 'v0.0.0-rehearsal' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Check the version matches the tag
        run: |
          version="$(sed -n 's/^ \* Version: //p' wp-updates-notifier.php | head -n 1)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$REHEARSE" = true ]; then exit 0; fi
          [ "v$version" = "$TAG" ] || { echo "Version $version does not match $TAG" >&2; exit 1; }

      # The zip, its .sha256 and the SBOM. SOURCE_DATE_EPOCH is the commit time, so
      # anyone can rebuild the same bytes from the tag (make dist-repro).
      - name: Build the zip and the SBOM
        run: |
          make sbom
          make dist-check
          ls -l build/

      # The zip is built with zip, rsync and git from Debian's apt, which the image does not pin, so the log records
      # the versions this build used (see "Verifying a release" in SECURITY.md).
      - name: Log the versions of the build tools
        run: docker compose run --rm -T php sh -c 'zip -v | sed -n 2p; rsync --version | head -n 1; git --version'

      # The zip as built above, not a rebuild: secrets-zip-scan fails the job on a finding.
      - name: Scan the zip for secrets
        run: make secrets-zip-scan

      - name: Attest the build provenance of the zip
        if: ${{ env.REHEARSE != 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/wp-updates-notifier-${{ env.VERSION }}.zip

      - name: Attest the SBOM of the zip
        if: ${{ env.REHEARSE != 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/wp-updates-notifier-${{ env.VERSION }}.zip
          sbom-path: build/wp-updates-notifier-${{ env.VERSION }}.cdx.json

      - name: Verify the attestation as a user would
        if: ${{ env.REHEARSE != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh attestation verify "build/wp-updates-notifier-$VERSION.zip" --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/release-please.yml" \
            --source-ref refs/heads/main --source-digest "$SHA"

      # The key is written to the runner's temp directory and removed as soon as this step ends, whatever the outcome
      # (the last step removes it again as a fallback).
      - name: Sign the release tag
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          TAGGER_NAME: ${{ vars.RELEASE_TAGGER_NAME }}
          TAGGER_EMAIL: ${{ vars.RELEASE_TAGGER_EMAIL }}
        run: |
          key="$RUNNER_TEMP/release-signing-key"
          trap 'rm -f "$key"' EXIT
          ( umask 077; printf '%s\n' "$SIGNING_KEY" > "$key" )
          git config gpg.format ssh
          git config user.signingkey "$key"
          git config user.name "$TAGGER_NAME"
          git config user.email "$TAGGER_EMAIL"
          sh bin/sign-release-tag.sh "$TAG" "$SHA"

      - name: Get a token from the release app
        if: ${{ env.REHEARSE != 'true' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The point of no return: a pushed v* tag can't be moved or deleted. Pushed and
      # published with the app token, not GITHUB_TOKEN, so publishing starts the WordPress.org deploy
      # (wordpress-org.yml; events made with GITHUB_TOKEN start no workflows).
      - name: Push the tag, upload the assets and publish the release
        if: ${{ env.REHEARSE != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
            git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "refs/tags/$TAG"
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber \
            "build/wp-updates-notifier-$VERSION.zip" \
            "build/wp-updates-notifier-$VERSION.zip.sha256" \
            "build/wp-updates-notifier-$VERSION.cdx.json"
          gh release edit "$TAG" --repo "$REPO" --draft=false --verify-tag --latest

      # A rehearsal publishes nothing, so the deploy rehearsal below takes the zip from here.
      - name: Keep the zip for the deploy rehearsal
        if: ${{ env.REHEARSE == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: |
            build/wp-updates-notifier-${{ env.VERSION }}.zip
            build/wp-updates-notifier-${{ env.VERSION }}.zip.sha256
          retention-days: 1
          if-no-files-found: error

      - name: Remove the signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release-signing-key"

  # Rehearses the WordPress.org deploy (#57) with the zip the rehearsal built: a dry run that checks out SVN, shows
  # the svn status of trunk, the new tag and assets/, and commits nothing. The real deploy is wordpress-org.yml, which
  # only a published release starts. A dry run needs no credentials (the SVN checkout is anonymous; the action only
  # checks that both are set), so this job has no environment and no secrets.
  wordpress-org-rehearsal:
    needs: [release-please, release]
    if: ${{ inputs.rehearse && needs.release-please.outputs.release_created != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version
        run: |
          echo "VERSION=$(sed -n 's/^ \* Version: //p' wp-updates-notifier.php | head -n 1)" >> "$GITHUB_ENV"

      - name: Download the rehearsal's zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: build/release

      - name: Verify the zip and unpack it
        run: |
          ( cd build/release && sha256sum -c "wp-updates-notifier-$VERSION.zip.sha256" )
          unzip -q "build/release/wp-updates-notifier-$VERSION.zip" -d build
          test -f build/wp-updates-notifier/wp-updates-notifier.php

      - name: Assemble and check the WordPress.org assets
        run: make wporg-assets-check

      - name: Deploy to WordPress.org (dry run)
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: true
        env:
          SVN_USERNAME: rehearsal
          SVN_PASSWORD: rehearsal
          SLUG: wp-updates-notifier
          BUILD_DIR: build/wp-updates-notifier
          ASSETS_DIR: build/wporg-assets
