# Every ecosystem waits 14 days after a release before proposing it (cooldown): a compromised release is
# usually found and pulled within days. Security updates for Dependabot alerts are not delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build

  # The pinned images of the security tools in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
