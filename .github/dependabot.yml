# Every ecosystem waits 14 days after a release before proposing it (cooldown): a compromised release is
# usually found and pulled within days. Security updates for Dependabot alerts are not delayed.
version: 2

# The Playwright image (tests/e2e/compose.yml) ships the browsers of exactly one Playwright version, so it must move
# with @playwright/test in tests/e2e/package.json. Separate PRs for the two could never pass the a11y job (#265), so
# the tests/e2e image and npm updates come together in one PR.
multi-ecosystem-groups:
  e2e:
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build

  # The pinned images of the security tools in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci

  # The ZAP image (and the database) of the DAST site, tests/dast/compose.yml.
  - package-ecosystem: docker-compose
    directory: /tests/dast
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci

  # The Playwright image (and the database) of the `make a11y` site, tests/e2e/compose.yml. In the e2e group, with
  # the npm packages below.
  - package-ecosystem: docker-compose
    directory: /tests/e2e
    multi-ecosystem-group: e2e
    patterns: ["*"]
    cooldown:
      default-days: 14

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope

  # Psalm for `make taint`: its own image and Composer project, as Psalm 6 needs PHP 8.1+. Keep the WordPress stubs
  # there at the version in the root composer.lock.
  - package-ecosystem: docker
    directory: /docker/psalm
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build

  - package-ecosystem: composer
    directory: /docker/psalm
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope

  # commitlint for `make commits`, installed with npm ci from docker/commitlint/package-lock.json.
  - package-ecosystem: npm
    directory: /docker/commitlint
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope

  # Playwright and axe for `make a11y`, installed with npm ci from tests/e2e/package-lock.json. In the e2e group.
  - package-ecosystem: npm
    directory: /tests/e2e
    multi-ecosystem-group: e2e
    patterns: ["*"]
    cooldown:
      default-days: 14

  # The documentation site (make docs): its image, MkDocs, Material and mike from docker/docs/requirements.txt (with
  # hashes, compiled from requirements.in), and the self-hosted Mermaid from docker/docs/package-lock.json.
  - package-ecosystem: docker
    directory: /docker/docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build

  - package-ecosystem: pip
    directory: /docker/docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /docker/docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    # Material for MkDocs is built against one Mermaid major (it names it in its unpkg fallback). Move Mermaid to a
    # new major together with Material, never ahead of it.
    ignore:
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
