# Every ecosystem waits 14 days after a release before proposing it (cooldown): a compromised release is
# usually found and pulled within days. Security updates for Dependabot alerts are not delayed.
version: 2

# The Playwright image (tests/e2e/compose.yml) ships the browsers of exactly one Playwright version, so it must move
# with @playwright/test in tests/e2e/package.json. Separate PRs for the two could never pass the a11y job (#265), so
# the tests/e2e image and npm updates come together in one PR.
multi-ecosystem-groups:
  e2e:
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # The documentation site's image, its Python packages and Mermaid change together and only affect the docs job, so
  # one PR a week instead of up to three.
  docs:
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

# Groups: each update below that can propose several bumps at once puts them in one PR a week, as every PR runs the
# CI it affects. Major versions stay out of the groups (update-types) and come in a PR of their own, so a breaking
# major never holds up the minor and patch bumps; security updates are never grouped.

updates:
  # Every action in one PR, majors included: they are pinned by SHA and reviewed together anyway.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # The PHP, WordPress, Composer, WP-CLI and Node images in docker/Dockerfile: one PR for all of them, as each
  # security release of PHP moves several tags at once (#284).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
    groups:
      images:
        patterns: ["*"]
        update-types: [minor, patch]

  # The pinned images of the security tools and the local site in docker-compose.yml, in one PR.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
    groups:
      tools:
        patterns: ["*"]
        update-types: [minor, patch]

  # The ZAP image (and the database) of the DAST site, tests/dast/compose.yml.
  - package-ecosystem: docker-compose
    directory: /tests/dast
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci

  # The Playwright image (and the database) of the `make a11y` site, tests/e2e/compose.yml. In the e2e group, with
  # the npm packages below.
  - package-ecosystem: docker-compose
    directory: /tests/e2e
    multi-ecosystem-group: e2e
    patterns: ["*"]
    cooldown:
      default-days: 14

  # The development tools in composer.json (PHPUnit, PHPCS, PHPStan, Rector, the stubs): one PR.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-tools:
        patterns: ["*"]
        update-types: [minor, patch]

  # Psalm for `make taint`: its own image and Composer project, as Psalm 6 needs PHP 8.1+. Keep the WordPress stubs
  # there at the version in the root composer.lock.
  - package-ecosystem: docker
    directory: /docker/psalm
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build

  # The base image of `make assets`.
  - package-ecosystem: docker
    directory: /docker/assets
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build

  - package-ecosystem: composer
    directory: /docker/psalm
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      psalm:
        patterns: ["*"]
        update-types: [minor, patch]

  # commitlint for `make commits`, installed with npm ci from docker/commitlint/package-lock.json.
  - package-ecosystem: npm
    directory: /docker/commitlint
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      commitlint:
        patterns: ["*"]
        update-types: [minor, patch]

  # Playwright and axe for `make a11y`, installed with npm ci from tests/e2e/package-lock.json. In the e2e group.
  - package-ecosystem: npm
    directory: /tests/e2e
    multi-ecosystem-group: e2e
    patterns: ["*"]
    cooldown:
      default-days: 14

  # Ajv for `make check-blueprint`, installed with npm ci from tests/bin/blueprint/package-lock.json.
  - package-ecosystem: npm
    directory: /tests/bin/blueprint
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      blueprint-check:
        patterns: ["*"]
        update-types: [minor, patch]

  # WordPress Playground CLI for `make blueprint-smoke`, installed with npm ci from tests/blueprint-smoke/package-lock.json.
  # A new version can need a newer tests/bin/blueprint/blueprint-schema.json (see the README next to it).
  - package-ecosystem: npm
    directory: /tests/blueprint-smoke
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
    groups:
      blueprint-smoke:
        patterns: ["*"]
        update-types: [minor, patch]

  # The documentation site (make docs): its image, MkDocs, Material and mike from docker/docs/requirements.txt (with
  # hashes, compiled from requirements.in), and the self-hosted Mermaid from docker/docs/package-lock.json. In the
  # docs group.
  - package-ecosystem: docker
    directory: /docker/docs
    multi-ecosystem-group: docs
    patterns: ["*"]
    cooldown:
      default-days: 14

  - package-ecosystem: pip
    directory: /docker/docs
    multi-ecosystem-group: docs
    patterns: ["*"]
    cooldown:
      default-days: 14

  - package-ecosystem: npm
    directory: /docker/docs
    multi-ecosystem-group: docs
    patterns: ["*"]
    cooldown:
      default-days: 14
    # Material for MkDocs is built against one Mermaid major (it names it in its unpkg fallback). Move Mermaid to a
    # new major together with Material, never ahead of it. Mermaid 11 needs katex ^0.16, so a newer katex would drag
    # Mermaid to 12 (#287): lift both ignores together.
    ignore:
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
      - dependency-name: katex
        versions: [">=0.17"]
