# Every ecosystem waits 14 days after a release before proposing it (cooldown): a compromised release is
# usually found and pulled within days. Security updates for Dependabot alerts are not delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build

  # The pinned images of the security tools in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci

  # The ZAP image (and the database) of the DAST site, tests/dast/compose.yml.
  - package-ecosystem: docker-compose
    directory: /tests/dast
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci

  # The Playwright image (and the database) of the `make a11y` site, tests/e2e/compose.yml. Its tag must stay at the
  # version of @playwright/test in tests/e2e/package.json: update them together.
  - package-ecosystem: docker-compose
    directory: /tests/e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope

  # Psalm for `make taint`: its own image and Composer project, as Psalm 6 needs PHP 8.1+. Keep the WordPress stubs
  # there at the version in the root composer.lock.
  - package-ecosystem: docker
    directory: /docker/psalm
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build

  - package-ecosystem: composer
    directory: /docker/psalm
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope

  # commitlint for `make commits`, installed with npm ci from docker/commitlint/package-lock.json.
  - package-ecosystem: npm
    directory: /docker/commitlint
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope

  # Playwright and axe for `make a11y`, installed with npm ci from tests/e2e/package-lock.json.
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
