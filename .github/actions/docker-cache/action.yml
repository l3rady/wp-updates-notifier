name: Docker layer and Composer caches
description: >-
  Builds the plugin's images with BuildKit against the GitHub Actions cache, so a job imports their layers instead of
  rebuilding PHP, its extensions and wordpress-develop from cold. Optionally restores vendor/ as well. For ci.yml and
  lint.yml only: never use it in a workflow that publishes a release, where a cache written by a pull request must
  not reach the build.
inputs:
  vendor:
    description: Also restore and save vendor/, for the jobs that run make deps.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # The docker driver can't export to the GitHub Actions cache; a docker-container builder can, and Compose
    # builds with it once it is the current builder.
    - name: Set up a BuildKit builder
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # BuildKit reaches the cache service with the runner's token and URLs, which only actions see. Hand them to the
    # rest of the job, as docker/build-push-action does for its own builds.
    - name: Give BuildKit the cache service
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
            if (process.env[name]) {
              core.exportVariable(name, process.env[name]);
            }
          }

    - name: Use the cache settings for the image builds
      shell: sh
      run: echo "COMPOSE_FILE=docker-compose.yml:docker/compose.ci-cache.yml" >> "$GITHUB_ENV"

    # composer.json pins the platform to PHP 7.4, so every PHP version installs the same vendor/. An exact key only:
    # make deps installs again whenever composer.lock is newer than vendor/, so a stale vendor/ is never used.
    - name: Restore vendor/
      if: inputs.vendor == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: vendor
        key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}
