<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WP Updates Notifier</title>
<style>
:root { color-scheme: dark light; --bg: #002b36; --fg: #93a1a1; --link: #4ea2e1; }
@media (prefers-color-scheme: light) { :root { --bg: #fdf6e3; --fg: #586e75; --link: #1b6aa6; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 1.125rem/1.6 system-ui, sans-serif; padding: 0 16px; }
main { max-width: 36rem; }
a { color: var(--link); }
</style>
</head>
<body>
<main>
<h1>WP Updates Notifier</h1>
<p>The plugin's website and documentation are on their way.</p>
<p>Until then, see the <a href="https://github.com/l3rady/wp-updates-notifier">project on GitHub</a> or the <a href="https://wordpress.org/plugins/wp-updates-notifier/">plugin on WordPress.org</a>.</p>
</main>
</body>
</html>
